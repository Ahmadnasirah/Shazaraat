<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شذرات | قريباً</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a; /* خلفية داكنة مريحة وفخمة */
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
            border-radius: 16px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .brand {
            font-size: 1.5rem;
            font-weight: 300;
            color: #38bdf8;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0 0 15px 0;
            color: #f8fafc;
            font-weight: 700;
        }
        p {
            font-size: 1.1rem;
            color: #94a3b8;
            line-height: 1.8;
            margin-bottom: 0;
        }
        .logo-placeholder {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px auto;
            background: linear-gradient(135deg, #38bdf8, #0369a1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-placeholder">ش</div>
        <div class="brand">شـذرات</div>
        <h1>الموقع تحت الإنشاء</h1>
        <p>نعمل حالياً على تطوير منصة متقدمة لخدمات النشر، التصميم البياني، والخرائط التفاعلية بمستوى احترافي فريد. انتظرونا قريباً!</p>
    </div>
</body>
</html>
